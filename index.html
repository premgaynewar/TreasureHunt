<!DOCTYPE html>
<html lang="en">
<head>

    <title>Treasure Game</title>
    <style>
        .basicBox{
            background-color: yellow;
            height: 200px; width: 200px;
            cursor: pointer;
        }
        .notFound{
            color: red;
            font-weight: bold;
        }
        .found{
            color: green;
            font-weight: bold;
            font-size: large;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

    </style>
</head>
<body>
    <h2> Find the Treasure</h2>
    
    <table border="2">
        <tr>
            <th><div id="MyBox1" class="basicBox" value="1" onclick="doSomething(this)"> </div></th>
            <th><div id="MyBox2" class="basicBox" value="2" onclick="doSomething(this)"> </div></th>
            <th><div id="MyBox3" class="basicBox" value="3" onclick="doSomething(this)"> </div></th>
        </tr>
        <tr>
            <td><div id="MyBox4" class="basicBox" value="4" onclick="doSomething(this)"> </div></td>
            <td><div id="MyBox5" class="basicBox" value="5" onclick="doSomething(this)"> </div></td>
            <td><div id="MyBox6" class="basicBox" value="6" onclick="doSomething(this)"> </div></td>
        </tr>
        <tr>
            <td><div id="MyBox7" class="basicBox" value="7" onclick="doSomething(this)"> </div></td>
            <td><div id="MyBox8" class="basicBox" value="8" onclick="doSomething(this)"> </div></td>
            <td><div id="MyBox9" class="basicBox" value="9" onclick="doSomething(this)"> </div></td>
        </tr>
    </table>
    <script>
        var treasurenumber = Math.floor(Math.random()*9)+1;
        console.log(treasurenumber);
        var treasure = document.getElementById("MyBox"+treasurenumber);

    </script>
    <div id="gameStatus">       </div>
    <div id="gameStatuswon"></div>
    <input style="height: 50px; width: 100px; background-color: chocolate;" type="reset" id="reset" value="clear" onclick="doclear()"/>    
    
    <script>
        var statusDiv = document.getElementById("gameStatus");
        var statusDivwon = document.getElementById("gameStatuswon");
        var attempt = 0;
        function doSomething(Box){
            if (Box.dataset.clicked == "true") {
                return;
            }
            Box.dataset.clicked="true";
            if(Box.id == treasure.id){
                Box.style.backgroundColor="green";
                statusDivwon.className="found";
                statusDivwon.innerHTML="Congratulations You Found The TREASURE";
                statusDiv.innerHTML=" ";
                Box.innerHTML='<img src="treasure.png" style="width:100%; height:100%;">';
                var winAudio = new Audio('won.mp3');
                winAudio.play();
            }else{
                attempt=attempt+1;
                Box.style.backgroundColor="red";
                statusDiv.className="notFound";
                statusDiv.innerHTML="Regret Treasure Not Found";
                Box.innerHTML='<img src="image.png" style="width:100%; height:100%;">';
            }
            if(attempt==3){
                alert("No more Attempts");
                window.location.reload();
            }      
        }
        function doclear(){
            window.location.reload();
        }
    </script>
   
</body>
</html>
